<script>
    window.partnerToast = function (text) {
        var el = document.createElement('div');
        el.className = 'p-toast'; el.setAttribute('role', 'status'); el.textContent = text;
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 3200);
    };
    window.partnerPost = function (url, body) {
        return fetch(url, {
            method: 'POST',
            headers: {'X-CSRF-TOKEN': document.querySelector('meta[name=csrf-token]').content, 'Accept': 'application/json', 'Content-Type': 'application/json'},
            body: JSON.stringify(body || {})
        }).then(function (r) {
            if (r.status === 401 || r.status === 419) { window.location.reload(); throw new Error('session'); }
            return r.json().then(function (d) { d._status = r.status; return d; });
        });
    };
    (function () {
        var btn = document.querySelector('[data-open-toggle]');
        btn.addEventListener('click', function () {
            var next = btn.dataset.open === '1' ? 0 : 1;
            if (!next && !confirm("Close the store  Customers will not be able to order until you open it again.")) return;
            partnerPost(btn.dataset.url, {is_open: next}).then(function (d) {
                btn.dataset.open = d.is_open ? '1' : '0';
                btn.classList.toggle('is-open', !!d.is_open);
                btn.classList.toggle('is-closed', !d.is_open);
                btn.setAttribute('aria-pressed', d.is_open ? 'true' : 'false');
                btn.querySelector('[data-open-label]').textContent = d.is_open ? "Open" : "Closed";
                partnerToast(d.is_open
                    ? (d.open_now ? "Open: customers can order now." : "Switched open, but outside your opening hours.")
                    : "Closed: no new orders.");
            }).catch(function () { partnerToast("Could not save. Check your connection."); });
        });
    })();
</script>
<script>
(function () {
    var modalEl = document.getElementById('menu-item-modal');
    var form = modalEl.querySelector('form');
    var title = modalEl.querySelector('[data-modal-title]');
    var modal = new bootstrap.Modal(modalEl);
    function open(action, item) {
        form.reset();
        form.action = action;
        title.textContent = item ? title.dataset.edit : title.dataset.new;
        if (item) {
            form.name.value = item.name || '';
            form.price.value = Math.round(item.price || 0);
            form.description.value = item.description || '';
            form.store_menu_category_id.value = item.store_menu_category_id || '';
            form.querySelector('input[type=checkbox][name=is_available]').checked = !!item.is_available;
        }
        modal.show();
    }
    document.querySelector('[data-menu-item-new]').addEventListener('click', function () { open(form.dataset.newAction, null); });
    document.querySelectorAll('[data-menu-item-edit]').forEach(function (b) {
        b.addEventListener('click', function () { open(b.dataset.action, JSON.parse(b.dataset.item)); });
    });
    var token = form.querySelector('input[name=_token]').value;
    document.querySelectorAll('[data-menu-availability]').forEach(function (input) {
        input.addEventListener('change', function () {
            var label = input.closest('label').querySelector('[data-availability-label]');
            fetch(input.dataset.menuAvailability, {
                method: 'POST',
                headers: {'X-CSRF-TOKEN': token, 'Accept': 'application/json', 'Content-Type': 'application/json'},
                body: JSON.stringify({is_available: input.checked ? 1 : 0})
            }).then(function (r) { if (!r.ok) throw r; return r.json(); })
              .then(function (d) {
                  label.textContent = d.is_available ? "Available" : "Sold out";
                  input.closest('.list-group-item').classList.toggle('opacity-75', !d.is_available);
              })
              .catch(function () { input.checked = !input.checked; alert("Could not save. Check your connection and try again."); });
        });
    });
})();
</script>
